<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WassWallet: control de gastos y finanzas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="wallet-container">
        <!-- Navegación Superior (PC) / Inferior (Móvil) -->
        <nav class="wallet-nav">
            <button class="nav-btn active" data-view="inicio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Inicio</span>
            </button>
            <button class="nav-btn" data-view="calendario">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>Calendario</span>
            </button>
            <button class="nav-btn" data-view="presupuesto">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Presupuesto</span>
            </button>
            <button class="nav-btn" data-view="cuentas">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <span>Cuentas</span>
            </button>
            <button class="nav-btn" data-view="deudas">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span>Deudas</span>
            </button>
        </nav>

        <!-- Contenedor Dinámico de Vistas -->
        <main id="app-view" class="wallet-content">
            <!-- Las vistas se inyectarán aquí mediante JS -->
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
